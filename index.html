<title>飞控从零学起</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: lesson list on the left, one lesson at a time on the right; every lesson = text + live demo + quiz. */
:root {
  --bg: #F2F4F7; --panel: #FFFFFF; --ink: #16202D; --soft: #586374; --line: #D8DDE5; --grid: #E7EBF0;
  --accent: #0D7A84; --tint: #E2F0F1; --b: #3157C9; --warn: #CF7A22; --warnbg: #FBEEDD; --bad: #C2433A; --ok: #2E8452;
  --f-head: "Space Grotesk", "Noto Sans SC", system-ui, sans-serif;
  --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E141B; --panel: #161F2A; --ink: #E5EAF0; --soft: #9BA7B5; --line: #2B3745; --grid: #212B37;
  --accent: #41B9C3; --tint: #13343A; --b: #809EF2; --warn: #EBA75C; --warnbg: #3A2B17; --bad: #E8776D; --ok: #5DC18C; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0E141B; --panel: #161F2A; --ink: #E5EAF0; --soft: #9BA7B5; --line: #2B3745; --grid: #212B37;
  --accent: #41B9C3; --tint: #13343A; --b: #809EF2; --warn: #EBA75C; --warnbg: #3A2B17; --bad: #E8776D; --ok: #5DC18C; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 16px/1.75 var(--f-body); margin: 0 }
.app { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 100vh }
nav { border-right: 1px solid var(--line); padding-block: 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto }
nav .brand { font: 700 19px/1.3 var(--f-head); margin: 0 0 4px }
nav .brand-sub { color: var(--soft); font-size: 13px; margin: 0 0 20px }
nav ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px }
nav a { display: grid; grid-template-columns: 28px 1fr 16px; align-items: baseline; gap: 6px; padding: 7px 8px; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: 14.5px; line-height: 1.4 }
nav a .n { font: 600 13px var(--f-mono); color: var(--soft) }
nav a:hover { background: var(--grid) }
nav a[aria-current="page"] { background: var(--tint); color: var(--accent); font-weight: 500 }
nav a[aria-current="page"] .n { color: var(--accent) }
nav a .ck { color: var(--ok); font-size: 13px }
nav .sep { height: 1px; background: var(--line); margin: 10px 4px }
nav .part { font: 600 12px var(--f-body); color: var(--soft); letter-spacing: .04em; margin: 14px 8px 4px }
main { padding-block: 40px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-width: 0 }
.lesson { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px }
.lesson > p, .lesson > ul, .lesson > ol { max-width: 68ch; margin: 0 }
.eyebrow { font: 600 13px var(--f-mono); letter-spacing: .06em; color: var(--accent); text-transform: uppercase; margin: 0 }
h1 { font: 700 clamp(28px, 4.2vw, 40px)/1.2 var(--f-head); margin: 0; text-wrap: balance }
h2 { font: 700 23px/1.35 var(--f-head); margin: 22px 0 0; text-wrap: balance }
h3 { font: 600 17px/1.4 var(--f-head); margin: 0 }
.lede { font-size: 18px; color: var(--soft) }
p { margin: 0 }
ul, ol { padding-left: 1.3em; margin: 0 }
li + li { margin-top: 4px }
b, strong { font-weight: 600 }
a { color: var(--accent) }
.term { font-weight: 600; color: var(--accent) }
.idea { background: var(--tint); border-radius: 10px; padding: 16px 20px; display: flex; flex-direction: column; gap: 8px; max-width: 68ch }
.idea h3 { color: var(--accent) }
.warnbox { background: var(--warnbg); border-radius: 10px; padding: 14px 20px; max-width: 68ch }
.formula { font: 500 17px/1.6 var(--f-mono); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 20px; overflow-x: auto; max-width: 68ch }
.formula .where { font: 14px/1.7 var(--f-body); color: var(--soft); margin-top: 8px }
.formula sub, .formula sup { font-size: .72em }
code, .mono { font-family: var(--f-mono); font-size: .92em }
.tblwrap { overflow-x: auto; max-width: 100% }
table.tbl { border-collapse: collapse; font-size: 15px; min-width: 100%; background: var(--panel) }
.tbl th, .tbl td { border: 1px solid var(--line); padding: 8px 12px; text-align: left; vertical-align: top }
.tbl th { background: var(--grid); font-weight: 600 }
.fig { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px }
.fig svg { max-width: 100%; height: auto }
.fig .cap { flex: 1 1 240px; min-width: 0; font-size: 14.5px; color: var(--soft) }
.flow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px }
.flow .bx { flex: 1 1 120px; min-width: 0; border: 1.5px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 14px; line-height: 1.45 }
.flow .bx b { display: block; font-family: var(--f-head); font-size: 15px }
.flow .bx .s { color: var(--soft); font-size: 12.5px }
.flow .bx.hl { border-color: var(--accent); background: var(--tint) }
.flow .bx.px { border-color: var(--warn); background: var(--warnbg) }
.flow .ar { align-self: center; color: var(--soft); font: 600 18px var(--f-mono) }

.demo { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 1px 0 var(--line) }
.demo-head { display: flex; flex-direction: column; gap: 4px }
.demo-head .tag { font: 600 12px var(--f-mono); letter-spacing: .06em; color: var(--warn); text-transform: uppercase }
.demo-head p { color: var(--soft); font-size: 14.5px; max-width: 70ch }
/* inline-SVG diagrams (K.S / K.fig), walkthroughs (K.steps), collapsible details (K.more) */
.svgfig { margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 14px 10px; display: flex; flex-direction: column; gap: 8px }
.svgfig svg { width: 100%; height: auto; display: block }
.svgfig.narrow { max-width: 520px }
.svgfig figcaption { color: var(--soft); font-size: 14px; line-height: 1.6 }
.figrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; align-items: start }
.sv-box { fill: var(--panel); stroke: var(--line); stroke-width: 1.5 }
.sv-box.hl { fill: var(--tint); stroke: var(--accent) }
.sv-box.px { fill: var(--warnbg); stroke: var(--warn) }
.sv-box.b { stroke: var(--b) }
.sv-box.on { stroke-width: 3 }
.sv-box.dim, text.dim { opacity: .35 }
.sv-t { fill: var(--ink); font: 600 14px var(--f-body) }
.sv-s { fill: var(--soft); font: 12.5px var(--f-body) }
.sv-n { fill: var(--accent); font: 600 13.5px var(--f-mono) }
.sv-nw { fill: var(--warn); font: 600 13.5px var(--f-mono) }
.sv-nb { fill: var(--b); font: 600 13.5px var(--f-mono) }
.sv-big { fill: var(--ink); font: 700 18px var(--f-head) }
.sv-s.acc { fill: var(--accent) } .sv-s.warn { fill: var(--warn) } .sv-s.b { fill: var(--b) } .sv-s.bad { fill: var(--bad) }
.sv-l-soft { stroke: var(--soft); stroke-width: 1.6; fill: none }
.sv-l-ink { stroke: var(--ink); stroke-width: 1.8; fill: none }
.sv-l-acc { stroke: var(--accent); stroke-width: 2.2; fill: none }
.sv-l-warn { stroke: var(--warn); stroke-width: 2.2; fill: none }
.sv-l-b { stroke: var(--b); stroke-width: 2.2; fill: none }
.sv-l-bad { stroke: var(--bad); stroke-width: 2.2; fill: none }
.sv-l-grid { stroke: var(--grid); stroke-width: 1; fill: none }
.sv-f-soft, .sv-fill-soft { fill: var(--soft) } .sv-f-ink, .sv-fill-ink { fill: var(--ink) } .sv-f-acc, .sv-fill-acc { fill: var(--accent) }
.sv-f-warn, .sv-fill-warn { fill: var(--warn) } .sv-f-b, .sv-fill-b { fill: var(--b) } .sv-f-bad, .sv-fill-bad { fill: var(--bad) }
.sv-fill-tint { fill: var(--tint) } .sv-fill-warnbg { fill: var(--warnbg) } .sv-fill-grid { fill: var(--grid) }
details.more { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); max-width: 72ch }
details.more summary { cursor: pointer; padding: 10px 16px; color: var(--accent); font-weight: 500; list-style-position: inside }
details.more .more-body { padding: 0 16px 12px; display: flex; flex-direction: column; gap: 10px }
.steps { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px }
.steps-head { display: flex; flex-direction: column; gap: 2px }
.steps-head .tag { font: 600 12px var(--f-mono); letter-spacing: .06em; color: var(--accent) }
.steps-fig svg { width: 100%; height: auto; display: block }
.steps-text { min-height: 3.4em; font-size: 15.5px; line-height: 1.7; max-width: 72ch }
.steps-n { font: 600 13px var(--f-mono); color: var(--accent); margin-right: 6px }
.steps-nav { display: flex; align-items: center; gap: 12px; flex-wrap: wrap }
.steps-nav button:disabled { opacity: .4; cursor: default }
.steps-dots { display: flex; gap: 6px; flex: 1; justify-content: center }
.steps-dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line) }
.steps-dots i.on { background: var(--accent) }
.assume { border-left: 3px solid var(--line); padding: 6px 12px; color: var(--soft); font-size: 13.5px; max-width: 78ch }
.assume b { color: var(--ink); font-weight: 500 }
.cv { width: 100%; border-radius: 8px; overflow: hidden; background: var(--bg); touch-action: none }
.cv canvas { display: block; width: 100% }
.cvs { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px }
.controls { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px 20px; align-items: end }
.ctl { display: flex; flex-direction: column; gap: 4px; min-width: 0 }
.ctl label, .ctl .lab { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; color: var(--soft) }
.ctl output { font: 600 13px var(--f-mono); color: var(--ink); font-variant-numeric: tabular-nums }
input[type=range] { width: 100%; accent-color: var(--accent) }
.seg-wrap { grid-column: span 1 }
.seg { display: flex; flex-wrap: wrap; gap: 4px }
.seg button, .btn { font: 500 13.5px var(--f-body); border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 6px; padding: 5px 10px; cursor: pointer }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--panel) }
.btn:hover, .seg button:hover { border-color: var(--accent) }
.btn.primary { background: var(--accent); color: var(--panel); border-color: var(--accent) }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.readout { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 13.5px; color: var(--soft); font-variant-numeric: tabular-nums }
.readout b { font: 600 14px var(--f-mono); color: var(--ink) }
.readout .hot { color: var(--bad) }
.readout .good { color: var(--ok) }
.try { font-size: 14.5px; border-left: 3px solid var(--warn); padding: 4px 0 4px 14px; max-width: 70ch }
.try ol { margin-top: 4px }

.key { border: 1.5px solid var(--accent); border-radius: 10px; padding: 16px 20px; max-width: 68ch; display: flex; flex-direction: column; gap: 8px }
.quiz { display: flex; flex-direction: column; gap: 16px; max-width: 72ch }
.q { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px }
.q[data-done] { border-color: var(--ok) }
.opts { display: flex; flex-direction: column; gap: 6px }
.opt { text-align: left; font: 15px/1.5 var(--f-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer }
.opt:hover { border-color: var(--accent) }
.opt.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, var(--panel)) }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--panel)) }
.expl { font-size: 14.5px; color: var(--soft) }
.okt { color: var(--ok) } .badt { color: var(--bad) }
.quiz-state { font-size: 14px; color: var(--soft) }
.quiz-state.done { color: var(--ok); font-weight: 600 }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 28px; flex-wrap: wrap }
.pager a { text-decoration: none; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 10px 14px; color: var(--ink); font-size: 14.5px; max-width: 48% }
.pager a:hover { border-color: var(--accent) }
.pager a .d { display: block; font-size: 12px; color: var(--soft) }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px }
.card { display: flex; flex-direction: column; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; text-decoration: none; color: var(--ink) }
.card:hover { border-color: var(--accent) }
.card .n { font: 600 13px var(--f-mono); color: var(--accent) }
.card .t { font: 600 16px var(--f-head) }
.card .s { font-size: 13.5px; color: var(--soft); line-height: 1.5 }
.card.done { border-color: var(--ok) }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr) }
  nav { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding-block: 14px; padding-right: max(16px, env(safe-area-inset-right, 0px)) }
  nav .brand-sub { display: none }
  nav ol { flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 4px }
  nav a { display: flex; white-space: nowrap; gap: 4px }
  nav a .t { display: none }
  nav a[aria-current="page"] .t { display: inline }
  nav .sep { display: none }
  nav .part { display: none }
  main { padding-block: 24px 60px }
  .pager a { max-width: 100%; flex: 1 1 100% }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important } }
</style>
<div class="app">
  <nav id="nav" aria-label="课程目录"></nav>
  <main id="main"></main>
</div>
<script>
window.FC_PUBLIC = true;
'use strict';
/* Shared toolkit: UI controls, canvas helpers, plots, quiz, a planar quadrotor model. */
const K = { lessons: [] };
(function () {
  const root = document.documentElement;
  K.add = L => K.lessons.push(L);
  /* public (open-source) build: build.py --public sets window.FC_PUBLIC before this file runs.
     K.ours(html, alt): content that only the full build shows; the public build shows alt (default nothing). */
  K.PUBLIC = typeof window !== 'undefined' && window.FC_PUBLIC === true;
  K.ours = (html, alt) => K.PUBLIC ? (alt || '') : html;
  K.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  K.deg = r => r * 180 / Math.PI;
  K.rad = d => d * Math.PI / 180;
  K.g = 9.81;
  K.randn = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  K.col = function () {
    const s = getComputedStyle(root), g = n => s.getPropertyValue(n).trim();
    return { bg: g('--bg'), panel: g('--panel'), ink: g('--ink'), soft: g('--soft'), line: g('--line'), grid: g('--grid'),
      acc: g('--accent'), b: g('--b'), warn: g('--warn'), bad: g('--bad'), ok: g('--ok'), tint: g('--tint') };
  };
  K.h = function (html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };

  /* animation loops, stopped when the lesson changes */
  K.loops = new Set();
  K.loop = function (fn) {
    const L = { on: true, last: null };
    const f = ts => {
      if (!L.on) return;
      if (L.last == null) L.last = ts;
      let dt = (ts - L.last) / 1000; L.last = ts;
      if (dt > 0.05) dt = 0.05;
      if (!document.hidden && dt > 0) fn(dt);
      L.raf = requestAnimationFrame(f);
    };
    L.raf = requestAnimationFrame(f);
    L.stop = () => { L.on = false; cancelAnimationFrame(L.raf); };
    K.loops.add(L); return L;
  };
  K.stopAll = () => { K.loops.forEach(l => l.stop()); K.loops.clear(); };
  K.sub = (dt, h, fn) => { const n = Math.max(1, Math.round(dt / h)); const hh = dt / n; for (let i = 0; i < n; i++) fn(hh); };

  /* controls */
  K.slider = function (parent, o) {
    const w = K.h(`<div class="ctl"><label for="${o.id}"><span>${o.label}</span><output for="${o.id}"></output></label><input type="range" id="${o.id}" min="${o.min}" max="${o.max}" step="${o.step}" value="${o.value}"></div>`);
    parent.appendChild(w);
    const inp = w.querySelector('input'), out = w.querySelector('output');
    const fmt = o.fmt || (v => String(v));
    const api = { el: w, v: +inp.value };
    const upd = fire => { api.v = +inp.value; out.textContent = fmt(api.v); if (fire && o.on) o.on(api.v); };
    inp.addEventListener('input', () => upd(true)); upd(false);
    api.set = v => { inp.value = v; upd(true); };
    return api;
  };
  K.seg = function (parent, o) {
    const w = K.h(`<div class="ctl seg-wrap"><span class="lab">${o.label}</span><div class="seg" role="group" aria-label="${o.label}"></div></div>`);
    const box = w.querySelector('.seg');
    const api = { el: w, v: String(o.value) };
    const paint = () => box.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === api.v)));
    o.options.forEach(([v, l]) => {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = l; b.dataset.v = String(v);
      b.addEventListener('click', () => api.set(v)); box.appendChild(b);
    });
    api.set = v => { api.v = String(v); paint(); if (o.on) o.on(api.v); };
    paint(); parent.appendChild(w); return api;
  };
  K.btn = function (parent, label, fn, cls) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'btn' + (cls ? ' ' + cls : ''); b.textContent = label;
    b.addEventListener('click', fn); parent.appendChild(b); return b;
  };
  K.demo = function (el, tag, title, hint) {
    const d = K.h(`<div class="demo"><div class="demo-head"><span class="tag">${tag}</span><h3>${title}</h3>${hint ? `<p>${hint}</p>` : ''}</div></div>`);
    el.appendChild(d); return d;
  };
  K.box = function (parent, cls, html) { const e = K.h(`<div class="${cls}">${html || ''}</div>`); parent.appendChild(e); return e; };

  /* canvas with device-pixel-ratio handling; draw in CSS pixels */
  K.canvas = function (parent, ratio, minH) {
    const wrap = document.createElement('div'); wrap.className = 'cv';
    const cv = document.createElement('canvas'); wrap.appendChild(cv); parent.appendChild(wrap);
    const o = { cv, wrap, ctx: cv.getContext('2d'), w: 0, h: 0 };
    o.fit = function () {
      const w = wrap.clientWidth || 600, h = Math.max(minH || 0, Math.round(w * ratio)), d = window.devicePixelRatio || 1;
      if (cv.width !== Math.round(w * d) || cv.height !== Math.round(h * d)) { cv.width = Math.round(w * d); cv.height = Math.round(h * d); cv.style.height = h + 'px'; }
      o.ctx.setTransform(d, 0, 0, d, 0, 0); o.w = w; o.h = h;
      const c = K.col(); o.ctx.fillStyle = c.bg; o.ctx.fillRect(0, 0, w, h);
      return o;
    };
    o.fit(); return o;
  };
  /* world (metres, z up) -> screen mapping with equal scale */
  K.view = function (W, H, x0, x1, z0, z1, pad) {
    pad = pad == null ? 12 : pad;
    const s = Math.min((W - 2 * pad) / (x1 - x0), (H - 2 * pad) / (z1 - z0));
    const ox = (W - s * (x1 - x0)) / 2, oy = (H - s * (z1 - z0)) / 2;
    return { s, X: x => ox + (x - x0) * s, Y: z => H - oy - (z - z0) * s, x0, x1, z0, z1,
      ix: px => x0 + (px - ox) / s, iz: py => z0 + (H - oy - py) / s };
  };
  K.grid = function (ctx, v, c, step) {
    step = step || 1;
    ctx.save(); ctx.strokeStyle = c.grid; ctx.lineWidth = 1;
    for (let x = Math.ceil(v.x0 / step) * step; x <= v.x1 + 1e-9; x += step) { ctx.beginPath(); ctx.moveTo(v.X(x), v.Y(v.z0)); ctx.lineTo(v.X(x), v.Y(v.z1)); ctx.stroke(); }
    for (let z = Math.ceil(v.z0 / step) * step; z <= v.z1 + 1e-9; z += step) { ctx.beginPath(); ctx.moveTo(v.X(v.x0), v.Y(z)); ctx.lineTo(v.X(v.x1), v.Y(z)); ctx.stroke(); }

function run(pct) {

}

  if (!crashed) {
    if (Math.abs(q.th) > K.rad(100)) crashed = '翻过去了。点“重来”。';

  }

  const o = cvo.fit(), c = K.col(), v = K.view(o.w, o.h, -5.5, 5.5, -0.2, 4.6, 8), ctx = o.ctx;

  const f = q.T / q.Tmax, dm = q.M / q.L / q.Tmax;
  K.drawQuad(ctx, v.X(q.x), v.Y(q.z), q.th, v.s * 1.6, { thrust: [f + dm, f - dm] });
  const sx = v.X(q.x), sy = v.Y(q.z), L = v.s * 1.1 * f;

const m = 2.74, Tmax = 1.95 * m * K.g, W = m * K.g;

/* one step of the height-only model used by the demo and by the offline figures (h seconds) */
function pidStep(st, h, kp, kd, ki, zr, ff, load) {
  const mt = m + (load ? 0.5 : 0), e = zr - st.z;
  if (ki > 0) st.I = K.clamp(st.I + e * h, -3 / Math.max(ki, 0.1), 3 / Math.max(ki, 0.1)); else st.I = 0;
  const u = (ff ? m * K.g : 0) + m * (kp * e + ki * st.I - kd * st.vz);
  st.T += (K.clamp(u, 0, Tmax) - st.T) * Math.min(1, h / 0.03);
  st.vz += (st.T / mt - K.g) * h; st.z += st.vz * h;
  if (st.z < 0) { st.z = 0; if (st.vz < 0) st.vz = 0; }
  if (st.z > 6) { st.z = 6; if (st.vz > 0) st.vz = 0; }
  return u;
}
/* offline run: start at z0, target 1.5 m, load attached at loadAt; returns [t, z] every 0.02 s */

/* ---- the demo's model: one height-only flight with a selectable height source (also run offline for the figures) ---- */
const ESTM = 2.74, EST_KP = 6, EST_KD = 4.5, BARO_DT = 0.02;
function rng(seed) { let s = seed >>> 0; const u = () => { s = (s * 1664525 + 1013904223) >>> 0; return (s + 0.5) / 4294967296; }; return () => Math.sqrt(-2 * Math.log(u())) * Math.cos(2 * Math.PI * u()); }
function estSim() {
  const St = { z: 1.5, vz: 0, T: ESTM * K.g, t: 0, ze: 1.5, ve: 0, be: 0, zb: 1.5, vb: 0, zbPrev: 1.5, tb: 0, zr: 1.5, zc: 1.5 };
  /* one step of h seconds; o = {src, w, noise, bias, randn} */
  St.step = (h, o) => {
    St.t += h;
    const zr = St.zr = (Math.floor(St.t / 4) % 2) ? 2.5 : 1.5;
    /* accelerometer along z, gravity already removed with the (here: exact) attitude: true acc + bias + noise */
    const am = St.T / ESTM - K.g + o.bias + 0.3 * o.randn();
    /* barometer at 50 Hz: true height + noise; the "baro velocity" is a filtered difference */
    St.tb += h;
    if (St.tb >= BARO_DT) { St.tb -= BARO_DT; const zNew = St.z + o.noise * o.randn(); St.vb += ((zNew - St.zbPrev) / BARO_DT - St.vb) * 0.15; St.zbPrev = zNew; St.zb = zNew; }
    /* estimators */
    const w = o.w, e = St.zb - St.ze;
    if (o.src === 'fuse') { St.ze += (St.ve + 3 * w * e) * h; St.ve += (am - St.be + 3 * w * w * e) * h; St.be -= w * w * w * e * h; }
    else { St.ze += St.ve * h; St.ve += am * h; }
    let zc, vc;
    if (o.src === 'true') { zc = St.z; vc = St.vz; }
    else if (o.src === 'baro') { zc = St.zb; vc = St.vb; }
    else { zc = St.ze; vc = St.ve; }
    St.zc = zc;
    const u = ESTM * (K.g + EST_KP * (zr - zc) - EST_KD * vc);
    St.T += (K.clamp(u, 0, 1.95 * ESTM * K.g) - St.T) * Math.min(1, h / 0.03);
    St.vz += (St.T / ESTM - K.g) * h; St.z += St.vz * h;
    if (St.z < 0) { St.z = 0; if (St.vz < 0) St.vz = 0; }

  };
  return St;
}
/* offline run with a fixed random seed: returns samples [t, true z, estimate the controller used, baro reading] and the rms estimate error */
function estRun(src, w, dur, seed, noise, bias) {
  const S = estSim(), rn = rng(seed), out = []; let se = 0, n = 0;

    if (S.t > 4) { se += (S.zc - S.z) ** 2; n++; }

}

<tr><td><b>卫星定位</b>（GNSS，常说的 GPS）</td><td>经纬度和海拔，许多接收机也给速度</td><td>户外有绝对参考，误差不会随时间累积</td><td>普通单频接收机的误差在米级，高度通常比水平方向更差；每秒只更新几次到十几次；室内基本不可用。RTK 等差分技术可以做到厘米级</td></tr>
<tr><td><b>测距仪</b>（激光或超声波，朝下）</td><td>沿着光束方向到下方物体的距离</td><td>近距离离地高度很准</td><td>量程有限；机身倾斜时读数变长（离地高度 ≈ 读数 × cos 倾角）；下面是桌子、草地还是地面，它分不清</td></tr>
<tr><td><b>磁力计</b></td><td>地磁场方向，用来定朝向</td><td>给出绝对朝向</td><td>电机电流和金属物体会干扰</td></tr>
<tr><td><b>动作捕捉 / 视觉</b></td><td>外部相机看机身上的标记点，或机载相机看环境，得到位置和朝向</td><td>室内动作捕捉可到毫米级</td><td>需要专门场地或足够的光照和纹理；数据要经过无线传输，有几十毫秒延迟</td></tr>
</table></div>`)}

<h2>为什么不能只用一个</h2>

<div class="formula">估计值 ← 预测值 + K × ( 测量值 − 预测值 )

<h2>PX4 里是怎么做的</h2>
${K.fig(figEKF, 'PX4 的状态估计模块叫 <b>EKF2</b>（扩展卡尔曼滤波器，卡尔曼滤波在非线性系统上的常用推广）。慢传感器的测量到得晚，EKF2 就在稍早的“测量那一刻”融合，再用 IMU 把结果快速推到现在：输出既及时，又用上了慢传感器。')}
${K.more('展开：EKF2 估计什么、高度参考源、倾角怎么估', `<ul>
<li>EKF2 估计的量包括姿态、速度、位置、陀螺仪和加速度计零偏、地磁场、风速等。</li>
<li><b>高度长期跟随一个“参考源”</b>，由参数 EKF2_HGT_REF 选择：气压计、卫星定位、测距仪或视觉。PX4 文档里户外的默认配置以卫星定位为高度参考，同时也融合气压计（气压计的偏差会被估计掉）。室内用动作捕捉时，通常改为以视觉为参考。</li>
<li><b>倾角是怎么估出来的</b>：陀螺仪积分会漂；加速度计在飞行时主要测到的是推力方向，不能直接当作“重力朝哪”。EKF2 通过比较“用 IMU 推算的速度”和“测量到的速度或位置”来发现倾角误差：倾角估错了，推算出的水平速度就会和测量对不上。</li>

</ul>`)}

  const R = rng(o.seed || 1), randn = () => { let u = 0, v = 0; while (!u) u = R(); while (!v) v = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const q = new K.Quad({ x: 0, z: 2 }); let t = 0, Ix = 0, Iz = 0, dx = 0, dz = 0, ou = 0, prev = 0, se = 0, sj = 0, n = 0;
  const tr = [];
  for (let k = 0; k < o.T / H; k++) {
    t += H;
    ou += -ou * H / 1.5 + Math.sqrt(2 * H / 1.5) * randn();
    let vw = o.wind * (1 + (o.gust ? 0.3 * ou + 0.25 * Math.sin(2 * Math.PI * t / 3.7) : 0));
    if (o.stepAt != null && t < o.stepAt) vw = 0;
    const vrel = vw - q.vx, Fw = 0.06 * vrel * Math.abs(vrel);
    const ex = -q.x, ez = 2 - q.z;

  }
  return { err: se / n * 100, jit: K.deg(Math.sqrt(sj / n)), tr };

${K.more('展开：完整公式，INDI、L1、Neural-Fly 的出处', `<div class="formula">外力估计  d̂ = 低通滤波[ m·a<sub>测量</sub> − ( T·z<sub>b</sub> − m·g·ẑ ) ]
<div class="where">d̂：外力的估计值；m：质量；a<sub>测量</sub>：飞机在世界坐标里的实际加速度（由加速度计读数换算得到；加速度计本身测不到重力造成的那部分加速度，换算时要补上）；T·z<sub>b</sub>：自己的推力向量；m·g·ẑ：重力。估出 d̂ 以后，第 6 课的力 F 里减掉它即可。注意：质量或推力本身算得不准，误差也会被当成“外力”一起估进来，这有时反而是好事（顺便补偿了模型误差）。</div></div>
<p><span class="term">INDI</span>（增量非线性动态逆，Smeur 等 2016、Tal 和 Karaman 2021）就是这个思路的一种做法：不去建扰动的模型，每一刻只根据“测到的”和“想要的”加速度之差，增量地修正推力。把“上一刻推力 + m × (想要的 a − 测到的 a)”展开，和“想要的力 − d̂”几乎是同一个式子，所以它和观测器很接近。相关论文报告它在强风和强扰动下效果很好。INDI 常常也用在角速度环里（根据测到的角加速度修正力矩，最好配合电机转速测量）；${K.ours('', `如果只能通过 CTBR 接口发指令，角速度环属于原版 PX4、改不了，就只能在外环（推力向量这一层）用 INDI 的思路。`)}</p>
<p><span class="term">L1 自适应控制</span>（Hovakimyan 和 Cao 等人提出）：用一个“状态预测器”预测飞机该怎么动，预测和实际的差用来快速更新扰动估计，再经过一个低通滤波器才送去控制。快速估计和平滑输出被分开，可以分别调。</p>
<p>后来的 <span class="term">Neural-Fly</span>（O'Connell 等 2022，Science Robotics）再进一步：先用数据学出一组描述“风力怎么随飞机状态变化”的基函数，飞行中只在线调整一小组线性系数。论文在风洞实验中报告，它的跟踪误差比 INDI、L1 等基线更小。</p>`)}

${K.fig(figTrade, `每个点是用实验模型飞 30 秒的结果（加速度计噪声 1 m/s²）。<b>左</b>：有阵风时，观测器截止频率从 0.5 Hz 调到 4 Hz，误差从 ${f1(G.dob[0].err, 1)} 降到 ${f1(G.dob[3].err, 1)} cm；再调到 30 Hz，误差只再降到 ${f1(G.dob[6].err, 1)} cm，抖动却涨到 ${f1(G.dob[6].jit, 0)} °/s。<b>右</b>：风很平稳时，<b>积分反而比观测器好</b>（${f1(ST.pid.err, 2)} cm 对 ${f1(ST.dob[3].err, 2)} cm）：恒定的力积分能补得很准，观测器却一直在吃噪声。`)}
${K.more('展开：为什么不能只看误差', `<p>观测器的截止频率调高，估计快、误差小，但指令会抖。真机上指令太抖会让电机发热、振动变大。${K.ours('', `所以比较控制器时最好同时统计“误差”和“指令平滑度”，不让一个控制器靠疯狂抖动来换小误差。`)}</p><p>这些点来自一个二维简化模型，加速度测量只有白噪声，没有零偏和延迟。噪声更大或有延迟时，截止频率太高甚至会让误差变大。所以右图的结论只说明“在平稳风里积分可以赢”，不能推出某种方法绝对更好。</p>`)}

<div class="key"><h3>这一课记住三件事</h3><ul>
<li>扰动 = 控制器不知道的力：风、机械臂、近地面气流、电压下降。</li>
<li>积分要等误差出现，慢；观测器 / INDI 用“测到的加速度 − 自己推力该产生的加速度”实时估出外力；前馈最快，但要事先知道。</li>

K.add({ id: 'l8', num: 9, title: '模型预测控制 MPC', sub: '先预测未来几秒，再挑最好的一串动作', render(el) {
const S = K.S;

/* ---------- the demo's planner (shared by the figures, the walkthrough and the live demo) ---------- */
const WALL = 3, AM = K.g * Math.tan(K.rad(30)), TAU = 0.12, LV = 11, NSEG = 3, NSTEP = 30;
const levels = Array.from({ length: LV }, (_, i) => -AM + 2 * AM * i / (LV - 1));
const degOf = u => K.deg(Math.atan(u / K.g));
/* roll one candidate (3 piecewise-constant tilt commands over horizon H) forward with the model; cost J, ok = no wall */
function roll(s, u, H, xt, keep) {
  const h = H / NSTEP; let x = s.x, v = s.v, a = s.a, J = 0, ok = true; const pts = keep ? [[0, x]] : null;
  for (let n = 0; n < NSTEP; n++) {

    if (keep) pts.push([(n + 1) * h, x]);
    J += ((x - xt) ** 2 + 0.002 * uc * uc) * h;
    if (x > WALL - 0.03) { ok = false; break; }
  }
  if (ok) J += 0.6 * (x - xt) ** 2 + 0.15 * v * v;
  return { J, ok, pts, x, v };
}
function planner(s, H, xt) {
  let best = 1e18, bu = -AM, bp = null, crash = 0;
  for (let i = 0; i < LV; i++) for (let j = 0; j < LV; j++) for (let k = 0; k < LV; k++) {
    const u = [levels[i], levels[j], levels[k]], r = roll(s, u, H, xt, false);
    if (!r.ok) { crash++; continue; }
    if (r.J < best) { best = r.J; bu = u[0]; bp = u; }

function gauss(r) { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
const r1 = v => Math.round(v * 10) / 10, mean = a => a.reduce((s, x) => s + x, 0) / a.length;

  const so = means.slice().sort((x, y) => x - y);
  return { picks, means, lo: so[Math.floor(0.025 * n)], hi: so[Math.floor(0.975 * n)] };
}

<h2>奖励和回报</h2>
<p>目标是让一个回合里奖励的总和——<span class="term">回报</span>（return）——尽量大。下面用实验里的起飞任务（从 1.0 m 爬到 1.8 m，每步 0.02 s，共 200 步）算一遍。</p>

<p>只在“到达目标”时给 1 分叫<span class="term">稀疏奖励</span>，智能体要碰巧到达过一次才知道往哪改，学得极慢；每一步按误差连续给分叫<span class="term">稠密奖励</span>。跟踪控制几乎都用稠密奖励。</p>
<p>奖励漏洞（reward hacking）：智能体最大化的是你<b>写下</b>的奖励，而不是你<b>心里想</b>的目标（Amodei 等 2016 年《Concrete Problems in AI Safety》把它列为一类典型问题）。所以学出来的控制器必须在独立测试集上用真实指标检验，不能只看训练得分。</p>`)}

<p>方向是从一批有噪声的试飞里估出来的，一次改太多，策略可能突然变差，训练就崩了。<span class="term">PPO</span>（Proximal Policy Optimization；Schulman 等，2017，arXiv）把概率之比的变化限制在一个比例内（论文实验取 ±20%）。Swift 竞速无人机（Kaufmann 等，Nature 2023）${K.ours('', `就用它`)}。</p>

<li><b>RAPTOR</b>（Eschmann、Albani、Loianno，Science Robotics 2026）：随机抽 1000 种四旋翼，每种用强化学习训一个“老师”，再蒸馏成一个只有 2084 个参数、带记忆的循环网络。它不知道飞机参数，只能从最近的飞行反应里推断，是“随机化 + 在线适应”的组合；直接输出电机转速（绕过角速度环），飞过 10 架约 32 克到约 2.4 千克的真机。据作者描述，迁移时主要困难是固件延迟而非参数不准；训练中没有随机化延迟。</li>
</ul>${K.ours('')}`)}

    else {
      const L = K.lessons.find(x => x.id === id), i = K.lessons.indexOf(L);
      const head = K.h(`<div style="display:flex;flex-direction:column;gap:10px"><p class="eyebrow">${L.num === '→' ? '第三部分 · 导读' : typeof L.num === 'number' ? '第 ' + L.num + ' 课 / 共 ' + numbered().length + ' 课' : '第三部分 · 相关工作精读 ' + L.num.slice(1)}</p><h1>${L.title}</h1></div>`);
      wrap.appendChild(head);
      const body = document.createElement('div'); body.style.cssText = 'display:flex;flex-direction:column;gap:18px'; wrap.appendChild(body);
      L.render(body);
      const prev = i > 0 ? K.lessons[i - 1] : home, next = K.lessons[i + 1];
      wrap.appendChild(K.h(`<div class="pager"><a href="#${prev.id}"><span class="d">上一页</span>${prev.title}</a>${next ? `<a href="#${next.id}" style="text-align:right;margin-left:auto"><span class="d">下一页</span>${next.title}</a>` : ''}</div>`));
    }
    window.scrollTo(0, 0);
  }
  K.onProgress = () => { const id = (location.hash || '#home').slice(1); renderNav(all.some(L => L.id === id) ? id : 'home'); };
  window.addEventListener('hashchange', go);
  go();
})();

</script>
